{{- if .Values.metallb.enabled }}
apiVersion: v1
kind: List
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-metallb-servicemonitors
  namespace: {{ template "kube-prometheus-stack.namespace" . }}
items:
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: {{ include "kube-prometheus-stack.fullname" . }}-metallb-controller
      namespace: {{ template "kube-prometheus-stack.namespace" . }}
      labels:
        app: {{ template "kube-prometheus-stack.name" . }}-prometheus
        {{ include "kube-prometheus-stack.labels" . | nindent 8 }}
        component: metallb
    spec:
      selector:
        matchLabels:
          app: metallb
          component: controller
      namespaceSelector:
        matchNames:
          - metallb-system
      endpoints:
        - port: monitoring
          {{- if .Values.metallb.serviceMonitor.https }}
          {{- /* MetalLB >=0.16 authenticates /metrics (TokenReview), so send the Prometheus
          service account token. bearerTokenFile is the only file-based option (`authorization`
          needs a Secret) and requires prometheus.prometheusSpec.arbitraryFSAccessThroughSMs not to be
          denied. See PMK-6975. */}}
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: {{ .Values.metallb.serviceMonitor.insecureSkipVerify }}
          {{- end }}
          interval: {{ .Values.metallb.serviceMonitor.interval | default "30s" }}
          scrapeTimeout: {{ .Values.metallb.serviceMonitor.scrapeTimeout | default "10s" }}
          path: {{ .Values.metallb.serviceMonitor.path | default "/metrics" }}

  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: {{ include "kube-prometheus-stack.fullname" . }}-metallb-speaker
      namespace: {{ template "kube-prometheus-stack.namespace" . }}
      labels:
        app: {{ template "kube-prometheus-stack.name" . }}-prometheus
        {{ include "kube-prometheus-stack.labels" . | nindent 8 }}
        component: metallb
    spec:
      selector:
        matchLabels:
          app: metallb
          component: speaker
      namespaceSelector:
        matchNames:
          - metallb-system
      endpoints:
        - port: monitoring
          {{- if .Values.metallb.serviceMonitor.https }}
          {{- /* MetalLB >=0.16 authenticates /metrics (TokenReview), so send the Prometheus
          service account token. bearerTokenFile is the only file-based option (`authorization`
          needs a Secret) and requires prometheus.prometheusSpec.arbitraryFSAccessThroughSMs not to be
          denied. See PMK-6975. */}}
          scheme: https
          bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          tlsConfig:
            insecureSkipVerify: {{ .Values.metallb.serviceMonitor.insecureSkipVerify }}
          {{- end }}
          interval: {{ .Values.metallb.serviceMonitor.interval | default "30s" }}
          scrapeTimeout: {{ .Values.metallb.serviceMonitor.scrapeTimeout | default "10s" }}
          path: {{ .Values.metallb.serviceMonitor.path | default "/metrics" }}
{{- end }}
